workflows:
  flet-android-build:
    name: Build Flet Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      vars:
        PYTHON_VERSION: "3.10"
    scripts:
      - name: Install dependencies
        script: |
          python3 -m pip install pip==24.2 setuptools==68.0.0 wheel==0.41.0
          pip3 install -r requirements.txt
      - name: Build APK with Flet
        script: |
          flet build apk
    artifacts:
      - build/apk/*.apk
      - build/app/outputs/flutter-apk/*.apk
