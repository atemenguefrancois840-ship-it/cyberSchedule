name: Build Flet APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Build APK
        run: yes | flet build apk --output build/apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberSchedule-APK
          path: |
            build/apk/*.apk
            build/apk/*/*.apk
            build/flutter/build/app/outputs/flutter-apk/*.apk
